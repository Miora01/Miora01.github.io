<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Işıklar Açılacak</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&display=swap" rel="stylesheet" />
<style>
  /* ===== Temel Stil ===== */
  body {
    margin: 0;
    font-family: 'Unbounded', sans-serif;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: radial-gradient(#000 0%, #0a0a0a 100%);
    background-size: 200% 200%;
    animation: bgPulse 10s ease-in-out infinite;
    overflow: hidden;
    transition: background-color 0.8s ease;
    position: relative;
  }
  .container {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  .swing {
    animation: swing 4s ease-in-out infinite;
    transform-origin: top center;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .rope {
    width: 2px;
    height: 100px;
    background-color: #888;
  }
  .bulb {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle at 30% 30%, #444, #222);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: inset 0 0 10px #000;
    user-select: none;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  .bulb::before {
    content: '';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 20px;
    background-color: #666;
    border-radius: 4px;
  }
  /* Ampul açık hali */
  .bulb.on {
    background: radial-gradient(circle at 30% 30%, #fff67e, #f3d250);
    box-shadow:
      0 0 20px 5px #fffa90,
      inset 0 0 20px 5px #fff67e;
  }

  /* Footer mesaj */
  .footer {
    width: 90%;
    max-width: 500px;
    margin: 20px auto 40px;
    padding: 25px 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    text-align: center;
    transition: box-shadow 0.3s ease, opacity 0.8s ease;
    user-select: none;
    opacity: 0;
    animation: fadeInText 3s ease forwards 1.5s;
    z-index: 10;
  }
  .footer:hover {
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.25);
  }
  .footer p {
    font-size: 20px;
    color: #eee;
    font-weight: 500;
    margin: 0;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  /* Modal widget */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 30px 40px;
    max-width: 400px;
    color: #eee;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    text-align: center;
    position: relative;
    user-select: none;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  /* Admin panel */
  #adminPanel {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:rgba(255,255,255,0.1);
    padding:30px 40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(31, 38, 135, 0.25);
    color:#eee;
    z-index:3000;
    text-align:center;
    font-family: 'Unbounded', sans-serif;
  }
  #adminPanel button {
    margin: 5px 10px;
    padding: 8px 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: background-color 0.3s ease;
  }
  #adminPanel button:hover {
    background-color: #5a6ef8;
    color: white;
  }

  /* Swing animasyonu */
  @keyframes swing {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(3deg); }
    50%  { transform: rotate(0deg); }
    75%  { transform: rotate(-3deg); }
    100% { transform: rotate(0deg); }
  }
  /* Fade in */
  @keyframes fadeInText {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  /* Background pulse */
  @keyframes bgPulse {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  /* Nabız (EKG) çizgisi */
  #ekg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    height: 100px;
    max-width: 900px;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }

  /* EKG kaplama ve animasyon için style */
  /* ... ayrıntılı ekranda JS ile dinamik çizim yapılıyor ... */

  /* İçe çekilme animasyonu (widget ve container için) */
  .collapse-animate {
    animation: collapseScaleFade 0.8s forwards;
  }
  @keyframes collapseScaleFade {
    0% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(0.3);
    }
  }

  /* Cench modu özel stilleri */
  body.cench-mode {
    background: white !important;
    animation: none !important;
    color: #444 !important;
  }
  body.cench-mode .container,
  body.cench-mode .footer,
  body.cench-mode #ekg,
  body.cench-mode .modal-overlay,
  body.cench-mode #adminPanel {
    display: none !important;
  }
  /* Ampul sabit görünür */
  body.cench-mode .bulb {
    background: radial-gradient(circle at 30% 30%, #fff67e, #f3d250) !important;
    box-shadow:
      0 0 40px 15px #fffa90,
      inset 0 0 40px 15px #fff67e !important;
    cursor: default !important;
    animation: none !important;
  }

  /* Ortadaki özel widget */
  #cenchWidget {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(240, 240, 240, 0.95);
    color: #c0392b;
    font-size: 24px;
    padding: 25px 40px;
    border-radius: 22px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(192, 57, 43, 0.3);
    user-select: none;
    text-align: center;
    z-index: 4000;
    display: none;
  }

  /* Kalp animasyonları */
  .heart {
    position: fixed;
    font-size: 30px;
    animation: floatUp 5s linear infinite;
    opacity: 0.85;
    user-select: none;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(1);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-50px) scale(1.5);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="container" id="mainContent">
    <div class="swing" id="bulb-container" tabindex="0" aria-label="Ampul, doğru zamanı bekliyor">
      <div class="rope"></div>
      <div class="bulb" id="bulb"></div>
    </div>
  </div>

  <canvas id="ekg"></canvas>

  <div class="footer" id="footerMsg">
    <p id="footerText">Işıklar açılacak, doğru zamanı bekliyor.</p>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-describedby="modalDesc">
    <div class="modal">
      <p id="modalDesc">Üzgünüm, ışıkları sen değil sadece <strong>Ecrin’im</strong> açabilir.<br>Çünkü doğru zamanı o bilir.</p>
      <button id="openKeyInputBtn" style="margin-top: 15px; background: rgba(255,255,255,0.15); border:none; padding: 8px 20px; border-radius: 15px; color:#eee; cursor:pointer;">Ecrin'im</button>
    </div>
  </div>

  <!-- Anahtar kelime input widget -->
  <div id="keyInputWidget" style="
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 30px 40px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
    display: none;
    z-index: 5000;
    user-select: none;
    text-align: center;
    font-family: 'Unbounded', sans-serif;
  ">
    <h2>Anahtar Kelimeyi Gir</h2>
    <input type="text" id="keyInput" placeholder="Anahtar kelime" autocomplete="off" style="font-size: 20px; padding: 10px; width: 220px; border-radius: 12px; border:none; outline:none; margin-top: 10px;" />
    <br />
    <button id="keySubmitBtn" style="
      margin-top: 15px;
      background: #555;
      border:none;
      color: white;
      font-weight: 700;
      font-size: 18px;
      border-radius: 15px;
      padding: 10px 24px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    ">Gönder</button>
    <br />
    <button id="keyCloseBtn" style="
      margin-top: 10px;
      background: #222;
      border:none;
      color: #aaa;
      font-weight: 500;
      font-size: 14px;
      border-radius: 12px;
      padding: 6px 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    ">Kapat</button>
  </div>

  <!-- Cench modu widget -->
  <div id="cenchWidget">
    Doğru zaman geldi, <br><strong>Cench</strong> zamanı... ❤️
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel">
    <h2>Admin Paneli</h2>
    <p>Ampul Durumunu Değiştir</p>
    <button onclick="setAmpul(true)">Ampulü Aç</button>
    <button onclick="setAmpul(false)">Ampulü Kapat</button>
    <br /><br />
    <button onclick="document.getElementById('adminPanel').style.display='none'">Kapat</button>
  </div>

  <!-- Tik-tak ses -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c351ba9e6.mp3" type="audio/mpeg" />
  </audio>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  // Firebase konfigürasyonu
  const firebaseConfig = {
    apiKey: "AIzaSyDYb071_2yKlgy6tNRjpW47esPBbzOGuI4",
    authDomain: "isiklar-39c08.firebaseapp.com",
    projectId: "isiklar-39c08",
    storageBucket: "isiklar-39c08.firebasestorage.app",
    messagingSenderId: "1097392235236",
    appId: "1:1097392235236:web:c3162f351ecbc4258b42f1",
    measurementId: "G-BWC9YWGM37"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const bulb = document.getElementById('bulb');
  const bulbContainer = document.getElementById('bulb-container');
  const modal = document.getElementById('modal');
  const footerText = document.getElementById('footerText');
  const modalOverlay = document.getElementById('modal');
  const mainContent = document.getElementById('mainContent');
  const footerMsg = document.getElementById('footerMsg');
  const keyInputWidget = document.getElementById('keyInputWidget');
  const keyInput = document.getElementById('keyInput');
  const keySubmitBtn = document.getElementById('keySubmitBtn');
  const keyCloseBtn = document.getElementById('keyCloseBtn');
  const openKeyInputBtn = document.getElementById('openKeyInputBtn');
  const censchWidget = document.getElementById('cenchWidget');

  // Nabız animasyonu canvas
  const ekgCanvas = document.getElementById('ekg');
  const ctx = ekgCanvas.getContext('2d');
  let width, height;
  let points = [];
  let maxPoints = 180;
  let speed = 1;
  let amplitude = 25;
  let isAmpulOn = false;
  let isCenchMode = false;

  // Responsive canvas ayarları
  function resizeCanvas() {
    width = window.innerWidth;
    height = 100;
    ekgCanvas.width = width;
    ekgCanvas.height = height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Rastgele dalga oluşturma
  function generatePoints() {
    points = [];
    for (let i = 0; i < maxPoints; i++) {
      let y = height / 2 + (Math.random() - 0.5) * amplitude;
      points.push(y);
    }
  }
  generatePoints();

  // Çizim değişkenleri
  let offset = 0;

  function drawEkg() {
    ctx.clearRect(0, 0, width, height);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#999';

    ctx.beginPath();
    for (let i = 0; i < maxPoints; i++) {
      let x = (i * width) / maxPoints;
      let y = points[i] + Math.sin((offset + i) * 0.3) * amplitude * 0.5;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    offset += speed;
    requestAnimationFrame(drawEkg);
  }

  drawEkg();

  // Ampulü aç kapa animasyon
  function setAmpul(on) {
    isAmpulOn = on;
    if (on) {
      bulb.classList.add('on');
      footerText.textContent = 'Işıklar açıldı, doğru zamanı bekliyor.';
    } else {
      bulb.classList.remove('on');
      footerText.textContent = 'Işıklar açılacak, doğru zamanı bekliyor.';
    }
    db.collection('settings').doc('status').set({ ampulAcik: on });
  }

  // Firebase'den durumu al
  db.collection('settings').doc('status').get().then(doc => {
    if (doc.exists) {
      setAmpul(doc.data().ampulAcik);
    }
  });

  // Modal aç/kapa işlemleri
  bulbContainer.addEventListener('click', () => {
    if (isCenchMode) return;
    modal.classList.add('active');
  });

  modal.addEventListener('click', e => {
    if (e.target === modal) modal.classList.remove('active');
  });

  // Ecrin'im düğmesine tıklayınca anahtar kelime widget açılır
  openKeyInputBtn.addEventListener('click', () => {
    modal.classList.remove('active');
    keyInputWidget.style.display = 'block';
    keyInput.focus();
  });

  // Anahtar kelime gönderme
  keySubmitBtn.addEventListener('click', () => {
    const val = keyInput.value.trim().toLowerCase();
    if (val === 'cench') {
      activateCenchMode();
      keyInputWidget.style.display = 'none';
    } else {
      alert('Anahtar kelime yanlış!');
    }
  });

  keyCloseBtn.addEventListener('click', () => {
    keyInputWidget.style.display = 'none';
  });

  // Cench modunu aktif et
  function activateCenchMode() {
    if (isCenchMode) return;
    isCenchMode = true;

    // İçeriği içe çekilerek gizle
    mainContent.classList.add('collapse-animate');
    footerMsg.classList.add('collapse-animate');
    modal.classList.remove('active');

    // Animasyon sonrası içerikleri gizle, arka plan beyaz yap
    setTimeout(() => {
      mainContent.style.display = 'none';
      footerMsg.style.display = 'none';
      ekgCanvas.style.display = 'none';
      document.body.classList.add('cench-mode');
      censchWidget.style.display = 'block';

      // Ampulü kesin açık yap
      setAmpul(true);

      // Kalp animasyonu başlat
      createHearts();
    }, 850);

    // Firebase'e kaydet
    db.collection('settings').doc('status').set({ ampulAcik: true });
  }

  // Kalp animasyonu
  function createHearts() {
    const heartCount = 30;
    for (let i = 0; i < heartCount; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (20 + Math.random() * 30) + 'px';
      heart.style.animationDuration = (3 + Math.random() * 5) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heart.textContent = '❤️';
      document.body.appendChild(heart);

      // Kalp animasyonu sona erince elementi kaldır
      heart.addEventListener('animationend', () => {
        heart.remove();
        // Sonsuz kalp için tekrar ekle
        if (isCenchMode) {
          setTimeout(() => createHearts(), Math.random() * 3000);
        }
      });
    }
  }

  // Admin panel açma (Shift + A)
  window.addEventListener('keydown', e => {
    if (e.shiftKey && e.key.toLowerCase() === 'a') {
      const panel = document.getElementById('adminPanel');
      if (panel.style.display === 'block') panel.style.display = 'none';
      else panel.style.display = 'block';
    }
  });

  // Nabız animasyonunda ampule yaklaştıkça nabız artışı
  bulbContainer.addEventListener('mouseenter', () => {
    speed = 3;
    amplitude = 45;
  });
  bulbContainer.addEventListener('mouseleave', () => {
    speed = 1;
    amplitude = 25;
  });
</script>
</body>
</html>
