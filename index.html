<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Işıklar Açılacak</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&display=swap" rel="stylesheet" />
<style>
  /* -- Eski stil kodlarını buraya olduğu gibi koy */
  body {
    margin: 0;
    font-family: 'Unbounded', sans-serif;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: radial-gradient(#000 0%, #0a0a0a 100%);
    background-size: 200% 200%;
    animation: bgPulse 10s ease-in-out infinite;
    overflow: hidden;
    transition: background-color 0.8s ease;
    position: relative;
  }
  .container {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  .swing {
    animation: swing 4s ease-in-out infinite;
    transform-origin: top center;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .rope {
    width: 2px;
    height: 100px;
    background-color: #888;
  }
  .bulb {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle at 30% 30%, #444, #222);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: inset 0 0 10px #000;
    user-select: none;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  .bulb::before {
    content: '';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 20px;
    background-color: #666;
    border-radius: 4px;
  }
  .bulb.on {
    background: radial-gradient(circle at 30% 30%, #fff67e, #f3d250);
    box-shadow:
      0 0 20px 5px #fffa90,
      inset 0 0 20px 5px #fff67e;
  }
  .footer {
    width: 90%;
    max-width: 500px;
    margin: 20px auto 40px;
    padding: 25px 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    text-align: center;
    transition: box-shadow 0.3s ease, opacity 0.8s ease;
    user-select: none;
    opacity: 0;
    animation: fadeInText 3s ease forwards 1.5s;
    z-index: 10;
  }
  .footer:hover {
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.25);
  }
  .footer p {
    font-size: 20px;
    color: #eee;
    font-weight: 500;
    margin: 0;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 30px 40px;
    max-width: 400px;
    color: #eee;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    text-align: center;
    position: relative;
    user-select: none;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  #adminPanel {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:rgba(255,255,255,0.1);
    padding:30px 40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(31, 38, 135, 0.25);
    color:#eee;
    z-index:3000;
    text-align:center;
    font-family: 'Unbounded', sans-serif;
  }
  #adminPanel button {
    margin: 5px 10px;
    padding: 8px 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: background-color 0.3s ease;
  }
  #adminPanel button:hover {
    background-color: #5a6ef8;
    color: white;
  }
  @keyframes swing {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(3deg); }
    50%  { transform: rotate(0deg); }
    75%  { transform: rotate(-3deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes fadeInText {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes bgPulse {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }
  #ekg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    height: 100px;
    max-width: 900px;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }
  .collapse-animate {
    animation: collapseScaleFade 0.8s forwards;
  }
  @keyframes collapseScaleFade {
    0% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(0.3);
    }
  }
  body.cench-mode {
    background: white !important;
    animation: none !important;
    color: #444 !important;
  }
  body.cench-mode .container,
  body.cench-mode .footer,
  body.cench-mode #ekg,
  body.cench-mode .modal-overlay,
  body.cench-mode #adminPanel {
    display: none !important;
  }
  body.cench-mode .bulb {
    background: radial-gradient(circle at 30% 30%, #fff67e, #f3d250) !important;
    box-shadow:
      0 0 40px 15px #fffa90,
      inset 0 0 40px 15px #fff67e !important;
  }

  /* Cench modu kalp animasyonu */
  .heart {
    position: fixed;
    animation-name: floatUp;
    animation-timing-function: ease-in-out;
    animation-iteration-count: 1;
    user-select: none;
    pointer-events: none;
    color: #ff4d6d;
    font-size: 25px;
    opacity: 0.8;
    z-index: 1500;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-200px) scale(1.5);
      opacity: 0;
    }
  }
  /* Anahtar kelime widget */
  #keyInputWidget {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    padding: 25px 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(31,38,135,0.25);
    backdrop-filter: blur(15px);
    color: #eee;
    font-family: 'Unbounded', sans-serif;
    font-weight: 500;
    font-size: 18px;
    user-select: none;
    display: none;
    z-index: 2000;
  }
  #keyInputWidget input {
    width: 220px;
    padding: 8px 12px;
    border-radius: 12px;
    border: none;
    margin-right: 12px;
    font-size: 16px;
    font-family: 'Unbounded', sans-serif;
  }
  #keyInputWidget button {
    padding: 8px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    background-color: #888;
    color: #eee;
    transition: background-color 0.3s ease;
  }
  #keyInputWidget button:hover {
    background-color: #666;
  }
  #keyInputWidget .closeBtn {
    position: absolute;
    top: 10px;
    right: 15px;
    background: transparent;
    border: none;
    font-size: 20px;
    color: #eee;
    cursor: pointer;
  }
  /* Ecrinim düğmesi modal içi */
  #openKeyInputBtn {
    margin-top: 20px;
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    background-color: #666;
    color: #eee;
    transition: background-color 0.3s ease;
    user-select: none;
  }
  #openKeyInputBtn:hover {
    background-color: #444;
  }
</style>
</head>
<body>
  <div class="container" id="mainContent">
    <div class="swing" id="bulbContainer">
      <div class="rope"></div>
      <div class="bulb" id="bulb"></div>
    </div>
  </div>

  <canvas id="ekg"></canvas>

  <div class="footer" id="footerMsg">
    <p id="footerText">Işıklar açılacak, doğru zamanı bekliyor.</p>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-describedby="modalDesc">
    <div class="modal">
      <p id="modalDesc">Üzgünüm, ışıkları sen değil sadece <strong>Ecrin’im</strong> açabilir.<br>Çünkü doğru zamanı o bilir.</p>
      <button id="openKeyInputBtn">Ecrin’im</button>
    </div>
  </div>

  <!-- Anahtar kelime widget -->
  <div id="keyInputWidget">
    <button class="closeBtn" id="keyCloseBtn">&times;</button>
    <p>Lütfen anahtar kelimeyi gir:</p>
    <input type="text" id="keyInput" autocomplete="off" />
    <button id="keySubmitBtn">Gönder</button>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel">
    <h2>Admin Panel</h2>
    <button id="toggleAmpulBtn">Ampul Aç/Kapa</button>
    <button id="resetCenchBtn">Cench Modu Sıfırla</button>
  </div>

  <!-- Tik-tak sesi -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c351ba9e6.mp3" type="audio/mpeg" />
  </audio>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
  // Firebase yapılandırma (senin verdiğin)
  const firebaseConfig = {
    apiKey: "AIzaSyDYb071_2yKlgy6tNRjpW47esPBbzOGuI4",
    authDomain: "isiklar-39c08.firebaseapp.com",
    projectId: "isiklar-39c08",
    storageBucket: "isiklar-39c08.firebasestorage.app",
    messagingSenderId: "1097392235236",
    appId: "1:1097392235236:web:c3162f351ecbc4258b42f1",
    measurementId: "G-BWC9YWGM37"
  };

  // Firebase başlat
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Elementler
  const bulb = document.getElementById('bulb');
  const bulbContainer = document.getElementById('bulbContainer');
  const footerText = document.getElementById('footerText');
  const modal = document.getElementById('modal');
  const mainContent = document.getElementById('mainContent');
  const footerMsg = document.getElementById('footerMsg');
  const keyInputWidget = document.getElementById('keyInputWidget');
  const keyInput = document.getElementById('keyInput');
  const keySubmitBtn = document.getElementById('keySubmitBtn');
  const keyCloseBtn = document.getElementById('keyCloseBtn');
  const openKeyInputBtn = document.getElementById('openKeyInputBtn');
  const adminPanel = document.getElementById('adminPanel');
  const toggleAmpulBtn = document.getElementById('toggleAmpulBtn');
  const resetCenchBtn = document.getElementById('resetCenchBtn');
  const ekgCanvas = document.getElementById('ekg');
  const ctx = ekgCanvas.getContext('2d');

  // Durumlar
  let isAmpulOn = false;
  let isCenchMode = false;

  // EKG canvas ayarları
  let maxPoints = 100;
  let points = [];
  let offset = 0;
  let speed = 1;
  let amplitude = 25;
  ekgCanvas.width = window.innerWidth * 0.9;
  ekgCanvas.height = 100;

  // EKG için random noktalar oluştur
  function generatePoints() {
    points = [];
    for (let i = 0; i < maxPoints; i++) {
      points.push(Math.random() * ekgCanvas.height * 0.6 + ekgCanvas.height * 0.2);
    }
  }
  generatePoints();

  // EKG çizim fonksiyonu
  function drawEkg() {
    ctx.clearRect(0, 0, ekgCanvas.width, ekgCanvas.height);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(150, 150, 150, 0.9)';
    ctx.beginPath();

    for (let i = 0; i < maxPoints - 1; i++) {
      let x1 = (i * ekgCanvas.width) / (maxPoints - 1);
      let y1 = points[i];
      let x2 = ((i + 1) * ekgCanvas.width) / (maxPoints - 1);
      let y2 = points[i + 1];

      // Iniș çıkış efektleri için amplitude ekle
      let waveHeight = amplitude * Math.sin((offset + i) * 0.3);

      ctx.lineTo(x1, y1 - waveHeight);
    }
    ctx.stroke();

    offset += speed;
    if (offset > maxPoints * 10) offset = 0;
  }

  // Animasyon döngüsü
  function animate() {
    if (!isCenchMode) {
      drawEkg();
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, ekgCanvas.width, ekgCanvas.height);
    }
  }

  // Ampul aç kapa görsel güncelle
  function updateAmpul() {
    if (isAmpulOn) {
      bulb.classList.add('on');
    } else {
      bulb.classList.remove('on');
    }
  }

  // Firestore’dan ayarları al ve gerçek zamanlı dinle
  function listenSettings() {
    db.collection('settings').doc('status').onSnapshot(doc => {
      if (!doc.exists) return;
      const data = doc.data();
      isAmpulOn = !!data.ampulAcik;
      isCenchMode = !!data.cenchMode;
      updateAmpul();
      applyMode();
    });
  }

  // Mod değişimi uygula
  function applyMode() {
    if (isCenchMode) {
      document.body.classList.add('cench-mode');
      spawnHearts();
    } else {
      document.body.classList.remove('cench-mode');
      clearHearts();
      if (!animationRunning) {
        animationRunning = true;
        animate();
      }
    }
  }

  // Modal aç/kapa
  function openModal() {
    modal.classList.add('active');
  }
  function closeModal() {
    modal.classList.remove('active');
  }

  // Kalp emojileri için animasyonlar
  let heartsInterval;
  function spawnHearts() {
    clearHearts();
    heartsInterval = setInterval(() => {
      const heart = document.createElement('div');
      heart.textContent = '❤️';
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.fontSize = (15 + Math.random() * 25) + 'px';
      heart.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 300);
  }
  function clearHearts() {
    clearInterval(heartsInterval);
    document.querySelectorAll('.heart').forEach(h => h.remove());
  }

  // Anahtar kelime widget aç/kapa
  function openKeyInput() {
    keyInputWidget.style.display = 'block';
    keyInput.value = '';
    keyInput.focus();
  }
  function closeKeyInput() {
    keyInputWidget.style.display = 'none';
  }

  // Anahtar kelime kontrolü
  async function checkKeyWord(word) {
    if (word.toLowerCase() === 'cench') {
      // Firestore’a mod değişimini yaz
      await db.collection('settings').doc('status').set({ ampulAcik: true, cenchMode: true });
      alert('Doğru anahtar kelime! Cench modu aktif edildi.');
      closeKeyInput();
    } else {
      alert('Anahtar kelime yanlış. Tekrar deneyin.');
    }
  }

  // Admin paneli aç/kapa Shift+A
  let adminPanelVisible = false;
  window.addEventListener('keydown', e => {
    if (e.shiftKey && e.key.toLowerCase() === 'a') {
      adminPanelVisible = !adminPanelVisible;
      adminPanel.style.display = adminPanelVisible ? 'block' : 'none';
    }
  });

  // Admin paneli butonları
  toggleAmpulBtn.addEventListener('click', async () => {
    isAmpulOn = !isAmpulOn;
    await db.collection('settings').doc('status').set({ ampulAcik: isAmpulOn, cenchMode: isCenchMode });
  });
  resetCenchBtn.addEventListener('click', async () => {
    isCenchMode = false;
    await db.collection('settings').doc('status').set({ ampulAcik: isAmpulOn, cenchMode: isCenchMode });
  });

  // Modal tıklama ve tuş olayları
  bulbContainer.addEventListener('click', () => {
    if (!isAmpulOn) openModal();
  });
  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });
  openKeyInputBtn.addEventListener('click', () => {
    closeModal();
    openKeyInput();
  });
  keySubmitBtn.addEventListener('click', () => {
    checkKeyWord(keyInput.value.trim());
  });
  keyCloseBtn.addEventListener('click', closeKeyInput);

  // Mouse ampule yaklaştığında EKG amplitude ve hız arttır
  bulbContainer.addEventListener('mouseenter', () => {
    speed = 3;
    amplitude = 60;
  });
  bulbContainer.addEventListener('mouseleave', () => {
    speed = 1;
    amplitude = 25;
  });

  // Sayfa yüklendiğinde ayarları dinle ve animasyonu başlat
  let animationRunning = true;
  listenSettings();
  animate();

  // Sayfa resize olduğunda canvas boyutunu güncelle
  window.addEventListener('resize', () => {
    ekgCanvas.width = window.innerWidth * 0.9;
    ekgCanvas.height = 100;
    generatePoints();
  });
</script>
</body>
</html>
